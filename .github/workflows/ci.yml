name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check-db:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Older ddccontrol versions can accept unresolved value IDs (issue #427).
      - name: Check out ddccontrol 3.3.0
        uses: actions/checkout@v6
        with:
          repository: ddccontrol/ddccontrol
          ref: 2b6c3d64388e05aced148d60d493b1e29563b756 # 3.3.0
          path: .ci/ddccontrol
          persist-credentials: false

      - name: Install validator build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint build-essential cargo gettext intltool \
            libglib2.0-dev libtool libxml2-dev pkg-config rustc

      - name: Build validator
        working-directory: .ci/ddccontrol
        run: |
          set -euo pipefail
          ./autogen.sh
          ./configure --disable-gnome --disable-nls
          make -j"$(nproc)"

      - name: Validate all monitor profiles
        run: |
          set -euo pipefail
          make check-db DDCCONTROL="$GITHUB_WORKSPACE/.ci/ddccontrol/src/ddccontrol/ddccontrol"

  build-and-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext \
            libxml-parser-perl \
            make

      - name: Build and validate
        run: |
          set -euo pipefail
          ./autogen.sh
          ./configure \
            --host="$(uname -m)-linux-gnu" \
            --build="$(uname -m)-linux-gnu" \
            --program-prefix= \
            --disable-dependency-tracking \
            --disable-silent-rules \
            --prefix=/usr \
            --exec-prefix=/usr \
            --bindir=/usr/bin \
            --sbindir=/usr/bin \
            --sysconfdir=/etc \
            --datadir=/usr/share \
            --includedir=/usr/include \
            --libdir=/usr/lib \
            --libexecdir=/usr/libexec \
            --localstatedir=/var \
            --sharedstatedir=/var/lib \
            --mandir=/usr/share/man \
            --infodir=/usr/share/info \
            --with-sysroot=/
          make -j"$(nproc)"
          make check
          make check-controls

      - name: Test staged installation
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          make install DESTDIR="$stage"
          test -f "$stage/usr/share/ddccontrol-db/options.xml"
          test -f "$stage/usr/share/ddccontrol-db/monitor/VESA.xml"
          test -f "$stage/usr/share/locale/fr/LC_MESSAGES/ddccontrol-db.mo"

      - name: Test make-time overrides and language filtering
        run: |
          set -euo pipefail
          make distclean
          ./configure --prefix=/opt/original
          stage="$(mktemp -d)"
          make install \
            PREFIX=/usr \
            LINGUAS="not_available fr" \
            DESTDIR="$stage"
          test -f "$stage/usr/share/ddccontrol-db/options.xml"
          test -f "$stage/usr/share/locale/fr/LC_MESSAGES/ddccontrol-db.mo"
          test ! -d "$stage/opt/original"

          lowercase_stage="$(mktemp -d)"
          make install \
            prefix=/opt/lowercase \
            LINGUAS=fr \
            DESTDIR="$lowercase_stage"
          test -f "$lowercase_stage/opt/lowercase/share/ddccontrol-db/options.xml"

      - name: Test release archives
        run: |
          set -euo pipefail
          make distclean
          ./configure --prefix=/usr
          make dist
          release_dir="$(mktemp -d)"
          tar -xf "ddccontrol-db-$(< VERSION).tar.xz" -C "$release_dir"
          source_dir="$release_dir/ddccontrol-db-$(< VERSION)"
          stage="$(mktemp -d)"
          (
            cd "$source_dir"
            ./configure --prefix=/usr
            make MSGFMT=false
            make MSGFMT=false install DESTDIR="$stage"
          )
          test -f "$stage/usr/share/ddccontrol-db/options.xml"
          test -f "$stage/usr/share/locale/fr/LC_MESSAGES/ddccontrol-db.mo"

      - name: Test build without translations
        run: |
          set -euo pipefail
          make distclean
          ./configure --prefix=/usr --disable-nls
          make
          stage="$(mktemp -d)"
          make install DESTDIR="$stage"
          test -f "$stage/usr/share/ddccontrol-db/options.xml"
          test ! -d "$stage/usr/share/locale"
          make dist-gzip
          test "$(tar -tzf "ddccontrol-db-$(< VERSION).tar.gz" | grep -c '/po/.*\.gmo$')" -eq 6

          if ./configure --prefix ""; then
            echo "configure accepted an empty prefix" >&2
            exit 1
          fi

      - name: Test temporary autoreconf compatibility
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake
          source_dir="$(mktemp -d)"
          cp -a . "$source_dir/source"
          (
            cd "$source_dir/source"
            make distclean
            autoreconf --force --install --verbose
            ./configure \
              --build="$(uname -m)-gentoo-linux-gnu" \
              --host="$(uname -m)-gentoo-linux-gnu" \
              --prefix=/usr \
              --datadir=/usr/share \
              --with-sysroot=/ \
              --disable-nls
            make
            stage="$(mktemp -d)"
            make install DESTDIR="$stage"
            test -f "$stage/usr/share/ddccontrol-db/options.xml"
            test ! -d "$stage/usr/share/locale"
          )

      - name: Test portable make syntax with bmake
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends bmake
          source_dir="$(mktemp -d)"
          cp -a . "$source_dir/source"
          (
            cd "$source_dir/source"
            bmake distclean
            MAKE=bmake ./configure --prefix=/opt/original
            bmake
            bmake check
            bmake check-controls
            stage="$(mktemp -d)"
            bmake install \
              prefix=/usr \
              LINGUAS="not_available fr" \
              DESTDIR="$stage"
            test -f "$stage/usr/share/ddccontrol-db/options.xml"
            test -f "$stage/usr/share/locale/fr/LC_MESSAGES/ddccontrol-db.mo"
            test ! -d "$stage/opt/original"

            bmake distclean
            MAKE=bmake ./configure --prefix=/usr --disable-nls
            bmake dist-gzip
            test "$(tar -tzf "ddccontrol-db-$(< VERSION).tar.gz" | grep -c '/po/.*\.gmo$')" -eq 6
          )

  cbor-producer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Read the immutable generator source and toolchain pins
        id: generator
        run: ./scripts/dbgen-source-pin.sh >> "$GITHUB_OUTPUT"

      - name: Check out the pinned Rust generator
        uses: actions/checkout@v6
        with:
          repository: ddccontrol/ddccontrol
          ref: ${{ steps.generator.outputs.revision }}
          path: .ci/ddccontrol-dbgen
          persist-credentials: false

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ci/ddccontrol-dbgen/target
          key: dbgen-${{ runner.os }}-${{ runner.arch }}-${{ steps.generator.outputs.toolchain }}-${{ steps.generator.outputs.revision }}-${{ hashFiles('.ci/ddccontrol-dbgen/Cargo.lock') }}
          restore-keys: |
            dbgen-${{ runner.os }}-${{ runner.arch }}-${{ steps.generator.outputs.toolchain }}-

      - name: Build the generator from its locked Rust dependencies
        env:
          GENERATOR_REVISION: ${{ steps.generator.outputs.revision }}
          RUST_TOOLCHAIN: ${{ steps.generator.outputs.toolchain }}
          DDCCONTROL_DB_TEST_DATADIR: ${{ github.workspace }}/db
          CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/ddccontrol-dbgen/target
        working-directory: .ci/ddccontrol-dbgen
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GENERATOR_REVISION"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo +"$RUST_TOOLCHAIN" build --locked --release -p ddccontrol-dbgen
          make -C "$GITHUB_WORKSPACE" db/options.xml
          cargo +"$RUST_TOOLCHAIN" test --locked -p ddccontrol-dbgen -p ddccontrol-db-format

      - name: Verify frozen fixtures and the complete XML database
        run: |
          set -euo pipefail
          make check-cbor DDCDBGEN="$GITHUB_WORKSPACE/.ci/ddccontrol-dbgen/target/release/ddccontrol-dbgen"

      - name: Compare XML and CBOR runtime behavior for every profile
        working-directory: .ci/ddccontrol-dbgen
        env:
          RUST_TOOLCHAIN: ${{ steps.generator.outputs.toolchain }}
          DDCCONTROL_DB_TEST_DATADIR: ${{ github.workspace }}/db
          DDCCONTROL_DB_CONVERTER: ${{ github.workspace }}/.ci/ddccontrol-dbgen/target/release/ddccontrol-dbgen
          CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/ddccontrol-dbgen/target
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" test --locked -p ddccontrol-db --features gettext \
            whole_database_xml_cbor_semantics_match_when_configured -- --nocapture
