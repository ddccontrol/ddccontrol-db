name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - name: Select the prebuilt CI image
        id: image
        run: echo "name=$(bash .github/ci/image-name.sh)" >> "$GITHUB_OUTPUT"

  check-db:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Validate all monitor profiles
        run: make check-db

  build-and-install:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Verify the prebuilt generator source and toolchain
        id: generator
        run: |
          set -euo pipefail
          ./scripts/dbgen-source-pin.sh >> "$GITHUB_OUTPUT"
          cmp .ci/ddccontrol-dbgen.rev /opt/ci/ddccontrol-dbgen.rev
          cmp .ci/ddccontrol-dbgen.toolchain /opt/ci/ddccontrol-dbgen.toolchain
          test "$(git -C /opt/ddccontrol-dbgen rev-parse HEAD)" = "$(cat .ci/ddccontrol-dbgen.rev)"
          ddccontrol-dbgen --version

      - name: Build and validate
        run: |
          set -euo pipefail
          ./autogen.sh
          ./configure \
            --host="$(uname -m)-linux-gnu" \
            --build="$(uname -m)-linux-gnu" \
            --program-prefix= \
            --disable-dependency-tracking \
            --disable-silent-rules \
            --prefix=/usr \
            --exec-prefix=/usr \
            --bindir=/usr/bin \
            --sbindir=/usr/bin \
            --sysconfdir=/etc \
            --datadir=/usr/share \
            --includedir=/usr/include \
            --libdir=/usr/lib \
            --libexecdir=/usr/libexec \
            --localstatedir=/var \
            --sharedstatedir=/var/lib \
            --mandir=/usr/share/man \
            --infodir=/usr/share/info \
            --with-sysroot=/
          make -j"$(nproc)"
          make check
          make check-controls
          make check-cbor

      - name: Test CBOR checks without Git
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/bin"

          # Regression coverage for #457: detect missing Git without forcing a skip.
          for executable in /usr/bin/* /bin/*; do
            name=${executable##*/}
            if [ "$name" != git ] && [ -f "$executable" ] && [ -x "$executable" ]; then
              ln -sf "$executable" "$work/bin/$name"
            fi
          done
          ln -s "$(command -v ddccontrol-dbgen)" "$work/bin/ddccontrol-dbgen"
          (
            export PATH="$work/bin"
            unset DDCCONTROL_DB_SKIP_GIT_TESTS MAKEFLAGS MFLAGS MAKEOVERRIDES
            if command -v git >/dev/null 2>&1; then
              echo "Git must be unavailable for this regression test" >&2
              exit 1
            fi
            make check-cbor
          ) 2>&1 | tee "$work/check-cbor.log"
          grep -Fx 'Skipping release archive checks: Git is unavailable or disabled.' "$work/check-cbor.log"
          grep -Fx 'CBOR producer integration checks passed.' "$work/check-cbor.log"
          grep -Fx 'CBOR build and installation regression checks passed.' "$work/check-cbor.log"

      - name: Test staged installation
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          make install DESTDIR="$stage"
          test -f "$stage/usr/share/ddccontrol-db/ddccontrol-db.cbor"
          test -f "$stage/usr/share/ddccontrol-db/ddccontrol-db.snapshot"
          test -f "$stage/usr/share/ddccontrol-db/options.xml"
          test -f "$stage/usr/share/ddccontrol-db/monitor/VESA.xml"
          test -f "$stage/usr/share/locale/fr/LC_MESSAGES/ddccontrol-db.mo"

      - name: Test make-time overrides and language filtering
        run: |
          set -euo pipefail
          make distclean
          ./configure --prefix=/opt/original
          stage="$(mktemp -d)"
          make install \
            PREFIX=/usr \
            LINGUAS="not_available fr" \
            DESTDIR="$stage"
          test -f "$stage/usr/share/ddccontrol-db/options.xml"
          test -f "$stage/usr/share/locale/fr/LC_MESSAGES/ddccontrol-db.mo"
          test ! -d "$stage/opt/original"

          lowercase_stage="$(mktemp -d)"
          make install \
            prefix=/opt/lowercase \
            LINGUAS=fr \
            DESTDIR="$lowercase_stage"
          test -f "$lowercase_stage/opt/lowercase/share/ddccontrol-db/options.xml"

      - name: Test release archives
        run: |
          set -euo pipefail
          make distclean
          ./configure --prefix=/usr
          make dist
          release_dir="$(mktemp -d)"
          tar -xf "ddccontrol-db-$(< VERSION).tar.xz" -C "$release_dir"
          source_dir="$release_dir/ddccontrol-db-$(< VERSION)"
          stage="$(mktemp -d)"
          (
            cd "$source_dir"
            ./configure --prefix=/usr
            make MSGFMT=false DDCDBGEN=false
            make MSGFMT=false DDCDBGEN=false install DESTDIR="$stage"
            rm db/monitor/VESA.xml
            if make DDCDBGEN=false; then
              echo "deleted source did not invalidate generated CBOR" >&2
              exit 1
            fi
            test ! -f db/ddccontrol-db.cbor
            test ! -f db/ddccontrol-db.snapshot
          )
          test -f "$stage/usr/share/ddccontrol-db/options.xml"
          test -f "$stage/usr/share/locale/fr/LC_MESSAGES/ddccontrol-db.mo"

      - name: Test build without translations
        run: |
          set -euo pipefail
          make distclean
          ./configure --prefix=/usr --disable-nls
          make
          stage="$(mktemp -d)"
          make install DESTDIR="$stage"
          test -f "$stage/usr/share/ddccontrol-db/options.xml"
          test ! -d "$stage/usr/share/locale"
          make dist-gzip
          test "$(tar -tzf "ddccontrol-db-$(< VERSION).tar.gz" | grep -c '/po/.*\.gmo$')" -eq 6

          if ./configure --prefix ""; then
            echo "configure accepted an empty prefix" >&2
            exit 1
          fi

      - name: Test temporary autoreconf compatibility
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          cp -a . "$source_dir/source"
          (
            cd "$source_dir/source"
            make distclean
            autoreconf --force --install --verbose
            ./configure \
              --build="$(uname -m)-gentoo-linux-gnu" \
              --host="$(uname -m)-gentoo-linux-gnu" \
              --prefix=/usr \
              --datadir=/usr/share \
              --with-sysroot=/ \
              --disable-nls
            make
            stage="$(mktemp -d)"
            make install DESTDIR="$stage"
            test -f "$stage/usr/share/ddccontrol-db/options.xml"
            test ! -d "$stage/usr/share/locale"
          )

      - name: Test portable make syntax with bmake
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          cp -a . "$source_dir/source"
          (
            cd "$source_dir/source"
            bmake distclean
            MAKE=bmake ./configure --prefix=/opt/original
            bmake
            bmake check
            bmake check-controls
            bmake check-cbor
            stage="$(mktemp -d)"
            bmake install \
              prefix=/usr \
              LINGUAS="not_available fr" \
              DESTDIR="$stage"
            test -f "$stage/usr/share/ddccontrol-db/options.xml"
            test -f "$stage/usr/share/locale/fr/LC_MESSAGES/ddccontrol-db.mo"
            test ! -d "$stage/opt/original"

            bmake distclean
            MAKE=bmake ./configure --prefix=/usr --disable-nls
            bmake dist-gzip
            test "$(tar -tzf "ddccontrol-db-$(< VERSION).tar.gz" | grep -c '/po/.*\.gmo$')" -eq 6
          )

      - name: Test the pinned producer and shared format
        working-directory: /opt/ddccontrol-dbgen
        env:
          RUST_TOOLCHAIN: ${{ steps.generator.outputs.toolchain }}
          DDCCONTROL_DB_TEST_DATADIR: ${{ github.workspace }}/db
          CARGO_TARGET_DIR: /opt/ddccontrol-dbgen/target
        run: |
          cargo +"$RUST_TOOLCHAIN" test --locked -p ddccontrol-dbgen -p ddccontrol-db-format

      - name: Compare XML and CBOR runtime behavior for every profile
        working-directory: /opt/ddccontrol-dbgen
        env:
          RUST_TOOLCHAIN: ${{ steps.generator.outputs.toolchain }}
          DDCCONTROL_DB_TEST_DATADIR: ${{ github.workspace }}/db
          DDCCONTROL_DB_CONVERTER: /opt/ddccontrol-dbgen/target/release/ddccontrol-dbgen
          CARGO_TARGET_DIR: /opt/ddccontrol-dbgen/target
        run: |
          cargo +"$RUST_TOOLCHAIN" test --locked -p ddccontrol-db --features gettext \
            whole_database_xml_cbor_semantics_match_when_configured -- --nocapture
